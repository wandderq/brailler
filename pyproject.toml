[project]
name = "brailler"
version = "2.0.0"
description = "Braille-based text art generator"
readme = "README.md"
authors = [
    { name = "wandderq", email = "wanddr.qq@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.10.1",
    "pillow>=12.1.0",
]

[project.scripts]
brailler = "brailler.main:_run_cli"

[build-system]
requires = ["uv_build>0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "uv>=0.12.15",
]

[tool.ruff]
line-length = 123

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY", "W293", "D100"
]