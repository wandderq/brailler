[project]
name = "brailler"
version = "1.0.0"
description = "CLI tool to convert images into braille-based text art"
readme = "README.md"
authors = [
    { name = "wandderq", email = "wanddr.qq@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.10.1",
    "numpy>=2.4.1",
    "pillow>=12.1.0",
]

[project.scripts]
brailler = "brailler.brailler:run_cli"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
